<nav class="topnav"><div class="in">

<script src="report.data.js"></script>
<script>
"use strict";
const D = window.REPORT;
const app = document.getElementById('app');
if (!D) { app.innerHTML = '<div class="err">report.data.js not found next to this file. Run <code>python3 report.py</code>.</div>'; throw new Error('no data'); }
const M = D.meta, C = D.constants, DAY = 864e5, MIN = 6e4;
const KEY = 'pov-hidden:' + M.domain;
let hidden = new Set(JSON.parse(localStorage.getItem(KEY) || '[]').filter(i => i < D.users.length));
const TIERS = ['Engaged', 'Light', 'Passive'], RANK = {Engaged: 3, Light: 2, Passive: 1};
const trivial = D.caps.map(c => c.trivial);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uname = i => typeof i === 'number' ? D.users[i] : i;
const short = i => uname(i).split('@')[0];
const pad = n => String(n).padStart(2, '0');
const tzParts = ms => Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone: M.tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}).formatToParts(new Date(ms)).map(p => [p.type, p.value]));
const fmtTs = ms => { if (!ms) return '-'; const p = tzParts(ms); return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const fmtD = ms => ms ? fmtTs(ms).slice(0, 10) : '-';
const wkLabel = date => new Date(date + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: '2-digit', timeZone: 'UTC'});
const addDays = (date, n) => { const d = new Date(date + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const decay = (age, hl = C.half_life_days) => Math.pow(0.5, Math.max(age, 0) / DAY / hl);
const dr = (x, k) => 1 - Math.exp(-x / k);
const r1 = x => Math.round(x * 10) / 10;
const weekIdx = ms => { for (let i = D.weeks.length - 1; i >= 0; i--) if (ms >= D.weeks[i].start) return i; return -1; };
const tierOf = (real, hw, b) => (real >= C.tier_engaged_min || ((hw || b) && real >= C.tier_light_min)) ? 'Engaged' : (real >= C.tier_light_min || hw || b) ? 'Light' : 'Passive';

// ---------- the model (a port of pov.py; parity with Python is checked on load) ----------
function tiers(ev, bu, lo, bucket) {
  const m = new Map();
  const get = (u, b) => { const k = u + '|' + b; let d = m.get(k); if (!d) { d = {u, b, real: new Set(), caps: new Set(), hw: 0, builds: 0, last: 0}; m.set(k, d); } return d; };
  for (const r of ev) { const d = get(r[0], bucket === 'week' ? r[7] : bucket); d.last = Math.max(d.last, r[1] * MIN); if (!trivial[r[2]]) { d.real.add(r[1]); d.caps.add(r[2]); } d.hw += r[3]; }
  for (const r of bu) { const d = get(r[0], bucket === 'week' ? weekIdx(r[1]) : bucket); d.builds++; d.last = Math.max(d.last, r[1]); }
  for (const r of lo) { const d = get(r[0], bucket === 'week' ? weekIdx(r[1]) : bucket); d.last = Math.max(d.last, r[1]); }
  for (const d of m.values()) d.tier = tierOf(d.real.size, d.hw, d.builds);
  return m;
}
function quality(engaged, active, nw, converted, droppedEng = 0) {
  if (converted >= 3 && engaged >= 3) return ['green', `Green: ${converted} users moved up to engaged (${engaged} engaged of ${active} active)`];
  if (engaged >= 3 && engaged >= 0.4 * active) return ['green', `Green: ${engaged} of ${active} active users engaged`];
  if (engaged === 0) return ['red', active === 0 ? 'Red: nobody active' : `Red: ${active} active, none engaged`];
  if (nw >= 5) return ['yellow', `Yellow: ${nw} new users enrolled, only ${engaged} engaged`];
  return ['yellow', `Yellow: ${engaged} engaged of ${active} active` + (droppedEng ? `, ${droppedEng} engaged user${droppedEng > 1 ? 's' : ''} dropped back` : '')];
}
function score(t, X) {
  const ev = X.ev.filter(r => r[1] * MIN < t), bu = X.bu.filter(r => r[1] < t), lo = X.lo.filter(r => r[1] < t), ms = X.ms.filter(r => r[0] < t);
  const tm = tiers(ev, bu, lo, 'week');
  const best = new Map();
  for (const d of tm.values()) best.set(d.u, Math.max(best.get(d.u) || 0, C.tier_weight[d.tier] * decay(t - d.last)));
  const people = [...best.values()].reduce((a, b) => a + b, 0);
  const all = new Set(), real = new Set(), byUser = new Map(), byCap = new Map();
  for (const r of ev) { all.add(r[0] + ':' + r[1]); if (!trivial[r[2]]) { real.add(r[0] + ':' + r[1]); byCap.set(r[2], (byCap.get(r[2]) || 0) + decay(t - r[1] * MIN)); } }
  let depth = 0;
  for (const k of real) { const [u, m] = k.split(':').map(Number); const w = decay(t - m * MIN); depth += w; byUser.set(u, (byUser.get(u) || 0) + w); }
  const breadth = [...byCap.values()].reduce((a, v) => a + Math.min(1, v / C.cap_full_minutes), 0);
  const building = bu.reduce((a, r) => a + (r[2] ? 0.5 : 1) * decay(t - r[1]), 0);
  const momentum = ms.reduce((a, r) => a + r[1] * decay(t - r[0], C.milestone_half_life_days), 0);
  const raw = {People: people, Depth: depth, Breadth: breadth, Building: building, Momentum: momentum};
  const parts = {}; let base = 0;
  for (const k of Object.keys(C.weights)) { parts[k] = C.weights[k] * dr(raw[k], C.k[k]); base += parts[k]; }
  let topU = null, topW = 0; for (const [u, w] of byUser) if (w > topW) { topU = u; topW = w; }
  const topShare = depth ? topW / depth : 0, conc = 1 - Math.max(0, topShare - 0.5);
  const s30 = t - 30 * DAY;
  let p = 0; for (const k of all) { const m = +k.split(':')[1]; if (m * MIN >= s30) p += decay(t - m * MIN); }
  let n = 0; for (const r of X.nr) if (r[1] >= s30 && r[1] < t) n += r[2] * decay(t - r[1]);
  const share = p + n ? p / (p + n) : 0, shareF = 0.5 + Math.min(share, 0.5);
  const wk = weekIdx(t - 1); let sust = 0;
  for (const w of [wk, wk - 1, wk - 2]) { let e = 0; for (const d of tm.values()) if (d.b === w && d.tier === 'Engaged') e++; if (e >= C.sustain_min_engaged) sust++; }
  const sustF = 0.7 + 0.1 * sust;
  const last = ms.length ? Math.max(...ms.map(r => r[0])) : null;
  const stalled = (t - M.start_ms >= C.stall_after_days * DAY) && (last === null || t - last > C.stall_window_days * DAY);
  const stallF = stalled ? C.stall_factor : 1;
  const sc = base * conc * shareF * sustF * stallF;
  return {score: Math.round(sc), base: r1(base), parts: Object.fromEntries(Object.entries(parts).map(([k, v]) => [k, r1(v)])), raw,
          conc: Math.round(conc * 100) / 100, topU, topShare, shareF: Math.round(shareF * 100) / 100, share, sustF: Math.round(sustF * 100) / 100, sust, stallF, last};
}
function compute() {
  const keep = i => !hidden.has(i);
  const X = {ev: D.ev.filter(r => keep(r[0])), bu: D.builds.filter(r => keep(r[0])), lo: D.logins.filter(r => keep(r[0])),
             ms: D.milestones.filter(r => r[4] < 0 || keep(r[4])), nr: D.nr.filter(r => keep(r[0]))};
  const asOf = M.as_of, tm = tiers(X.ev, X.bu, X.lo, 'week');
  const byWeek = D.weeks.map(() => new Map());
  for (const d of tm.values()) if (d.b >= 0) byWeek[d.b].set(d.u, d.tier);
  const firstSeen = new Map(); byWeek.forEach((m, i) => { for (const u of m.keys()) if (!firstSeen.has(u)) firstSeen.set(u, i); });
  const evWeek = D.weeks.map(() => ({users: new Set(), minutes: new Set()}));
  for (const r of X.ev) { evWeek[r[7]].users.add(r[0]); evWeek[r[7]].minutes.add(r[0] + ':' + r[1]); }
  let seen = new Set(), prevActive = new Set(), prev = new Map();
  const weekly = D.weeks.map((w, i) => {
    const t = Math.min(w.end, asOf), detail = score(t, X), cur = byWeek[i], a = evWeek[i].users;
    const row = {i, date: w.date, score: detail.score, detail, active: a.size, minutes: evWeek[i].minutes.size,
                 new_: [...a].filter(u => !seen.has(u)).length, lapsed: [...prevActive].filter(u => !a.has(u)).length,
                 who: [...a].map(short).sort(), tiers: Object.fromEntries(TIERS.map(k => [k, [...cur].filter(([, t]) => t === k).map(([u]) => u)])),
                 tr: {new_: 0, newEng: 0, up: 0, toEng: 0, same: 0, down: 0, dropped: 0, droppedEng: 0}, gb: D.ingest[i].gb};
    for (const [u, t2] of cur) {
      if (firstSeen.get(u) === i) { row.tr.new_++; if (t2 === 'Engaged') row.tr.newEng++; continue; }
      const a0 = RANK[prev.get(u)] || 0, a1 = RANK[t2];
      if (a1 > a0) { row.tr.up++; if (t2 === 'Engaged') row.tr.toEng++; } else if (a1 < a0) row.tr.down++; else row.tr.same++;
    }
    for (const [u, t2] of prev) if (!cur.has(u)) { row.tr.dropped++; if (t2 === 'Engaged') row.tr.droppedEng++; }
    const eng = row.tiers.Engaged.length;
    [row.colour, row.reason] = quality(eng, cur.size, row.tr.new_, row.tr.toEng, row.tr.droppedEng);
    for (const u of a) seen.add(u); prevActive = a; prev = cur;
    return row;
  });
  const lastW = D.weeks.length - 1;
  const cohorts = D.weeks.map((w, i) => {
    const members = [...firstSeen].filter(([, f]) => f === i).map(([u]) => u); if (!members.length) return null;
    const ranks = members.map(u => Math.max(...byWeek.slice(i).map(m => RANK[m.get(u)] || 0)));
    return {date: w.date, size: members.length, light: ranks.filter(r => r >= 2).length, engaged: ranks.filter(r => r >= 3).length,
            now: members.filter(u => byWeek[lastW].get(u) === 'Engaged').length};
  }).filter(Boolean);
  const now = score(asOf, X);
  const l7 = tiers(X.ev.filter(r => r[1] * MIN >= asOf - 7 * DAY), X.bu.filter(r => r[1] >= asOf - 7 * DAY), X.lo.filter(r => r[1] >= asOf - 7 * DAY), 'now');
  const before = new Set([...tm.values()].filter(d => d.b >= 0 && D.weeks[d.b].start < asOf - 7 * DAY).map(d => d.u));
  const eng7 = [...l7.values()].filter(d => d.tier === 'Engaged').length;
  [now.colour, now.reason] = quality(eng7, l7.size, [...l7.values()].filter(d => !before.has(d.u)).length, 0);
  if (now.reason === 'Red: nobody active') now.reason = 'Red: nobody from the prospect active in the last 7 days';
  const since = M.since, w30 = X.ev.filter(r => r[1] * MIN >= since);
  const lastMin = X.ev.reduce((a, r) => r[1] > a[1] ? r : a, [null, 0]);
  const p30 = new Set(w30.map(r => r[0] + ':' + r[1])).size, n30 = X.nr.filter(r => r[1] >= since).reduce((a, r) => a + r[2], 0);
  const fullWeeks = weekly.filter(w => D.weeks[w.i].end <= asOf), lfw = fullWeeks[fullWeeks.length - 1];
  return {X, tm, weekly, cohorts, now, w30, kpi: {
    active7: new Set(X.ev.filter(r => r[1] * MIN >= asOf - 7 * DAY).map(r => r[0])).size, active30: new Set(w30.map(r => r[0])).size,
    lastMs: lastMin[0] === null ? null : lastMin[1] * MIN, lastWho: lastMin[0], share30: p30 + n30 ? p30 / (p30 + n30) : null,
    lfw}};
}
function period(weekly, a, b) {
  const ws = weekly.filter(w => w.date <= b && addDays(w.date, 6) >= a);
  if (!ws.length) return null;
  const sc = ws.map(w => w.score), last = sc.slice(-4), n = last.length, m = last.reduce((x, y) => x + y, 0) / n;
  const slope = n > 1 ? last.reduce((acc, v, i) => acc + (i - (n - 1) / 2) * (v - m), 0) / last.reduce((acc, _, i) => acc + (i - (n - 1) / 2) ** 2, 0) : 0;
  const c = {green: 0, yellow: 0, red: 0}; ws.forEach(w => c[w.colour]++);

<p class="small muted">Same weeks, two panels. Data keeps flowing while nobody looks = money spent on an unused PoV.</p>
${columns(W.map(w => [w.date, Math.round(w.gb / 100) / 10, w.reason]), {unit: 'TB ingested', w: 760, h: 130, label: wkLabel, cls: 'f-nr', weekly: true})}
${columns(W.map(w => [w.date, w.active, `${w.tiers.Engaged.length} engaged`]), {unit: 'prospect users active', w: 760, h: 130, label: wkLabel, weekly: true})}
<div class="legend"><span><span class="sw" style="background:var(--nr)"></span>TB ingested (NrConsumption)</span><span><span class="sw" style="background:var(--series-1)"></span>prospect users active</span></div></details>
<details class="card" open><summary>Onboarding milestones (Momentum)</summary>
<p class="small muted">Ingest keys created by the prospect, first data of each type, first entity of each type, ingest-growth weeks. Credit fades (${C.milestone_half_life_days}-day half-life); after ${Math.round(C.stall_after_days / 7)} weeks, ${C.stall_window_days} days with nothing new costs ×${C.stall_factor}.</p>
${timeline(S.X.ms)}${fold(`All milestones (${S.X.ms.length})`, '', 'milestones')}</details>
<details class="card" data-render="weeklyTable"><summary>Weekly detail: every number behind the score</summary><div class="fold-body"></div></details>`;
}
function renderAppendix() {
  return `<h2 id="appendix">Appendix</h2>
${['nrCompare:New Relic staff vs prospect (last ' + M.window_days + ' days)', 'sessions:Every estimated session, per user (last ' + M.window_days + ' days)', 'apiAi:API-key and AI / MCP activity (not counted as human)',
   'mix:Channel mix per person', 'changes:Config changes, incl. admin and New Relic staff', 'native:Logins and native sessions', 'method:How this report works']
  .map(x => { const [k, t] = x.split(/:(.+)/); return `<details class="card" data-render="${k}"><summary>${esc(t)}</summary><div class="fold-body"></div></details>`; }).join('')}`;
}
const keepU = i => typeof i !== 'number' || !hidden.has(i);
lazy = {
  progressionTable: () => table(['Week', 'Quality', 'Active', 'Engaged', 'New (engaged)', 'Moved up (to engaged)', 'Same', 'Moved down', 'Dropped (were engaged)'],
    S.weekly.map(w => [w.date, esc(w.reason), w.active, w.tiers.Engaged.length, `${w.tr.new_} (${w.tr.newEng})`, `${w.tr.up} (${w.tr.toEng})`, w.tr.same, w.tr.down, `${w.tr.dropped} (${w.tr.droppedEng})`]), {rank: false, top: 99}),
  cohortTable: () => table(['First week', 'Size', 'Ever light+', 'Ever engaged', 'Engaged in the latest week'], S.cohorts.map(c => [c.date, c.size, c.light, c.engaged, c.now]), {rank: false, top: 99}),
  whoToCall: () => table(['User', 'Status', 'UI minutes (PoV)', 'Last UI use', 'Logins', 'Invited', 'Invited by'],
    D.funnel_rows.filter(r => keepU(r.user)).sort((a, b) => (a.status === 'active') - (b.status === 'active') || b.minutes - a.minutes)
      .map(r => [esc(uname(r.user)), esc(r.status), r.minutes, fmtD(r.last), r.logins, fmtD(r.invited_at), esc(r.invited_by)])),
  heat: () => { const c = {}, seen = new Set(); for (const r of S.w30) { const k = r[0] + ':' + r[1]; if (seen.has(k)) continue; seen.add(k); const key = D.days[r[5]].weekday + ':' + r[6]; c[key] = (c[key] || 0) + 1; } return heatmap(c); },
  digest: () => D.digest.filter(d => keepU(d.user)).sort((a, b) => b.distinct - a.distinct).map(d =>
    fold(`${short(d.user)}: ${d.distinct} distinct queries, ${d.event_types.slice(0, 3).map(x => x[0]).join('/') || 'no FROM'}${d.custom.length ? ', ' + d.custom.slice(0, 3).join(', ') + '…' : ''}`,
      `<p class="small"><b>Origin:</b> ${esc(Object.entries(d.origins).map(([k, v]) => k + ' ' + v).join(', '))} · <b>Event types:</b> ${esc(d.event_types.map(x => `${x[0]} (${x[1]})`).join(', '))}<br><b>Attributes filtered/faceted on:</b> ${esc(d.attrs.map(x => `${x[0]} (${x[1]})`).join(', ') || '-')}<br><span class="muted">Likely custom: ${esc(d.custom.join(', ') || '-')}</span></p>`
      + table(['Query (time clauses stripped)', 'Runs'], d.queries.map(q => [`<code>${esc(q[0].slice(0, 300))}</code>`, q[1]])))).join('') || '<p class="muted small">No hand-written queries.</p>',
  assets: () => '<h3>Dashboards the prospect created</h3>' + table(['Dashboard', 'Creator', 'Views by creator', 'Views by others', 'Other viewers', 'Weeks viewed', 'Last view'],
      D.dashboards.filter(d => keepU(d.creator)).sort((a, b) => (b.creator_views + b.other_views) - (a.creator_views + a.other_views))
        .map(d => [esc(d.name), esc(short(d.creator)), d.creator_views, d.other_views, d.other_viewers, d.weeks_viewed, fmtD(d.last_view)]))
    + '<h3 style="margin-top:12px">Build actions (no admin)</h3>' + table(['When', 'Who', 'Action', 'Target', 'Detail'], S.X.bu.slice().sort((a, b) => b[1] - a[1]).map(r => [fmtD(r[1]), esc(short(r[0])), esc(r[3]), esc(r[4]), esc(r[5])]), {rank: false}),
  milestones: () => table(['When', 'Milestone', 'What'], S.X.ms.map(m => [fmtD(m[0]), esc(m[2]), esc(m[4] >= 0 ? short(m[4]) : m[3])]), {rank: false, top: 99}),
  weeklyTable: () => table(['Week', 'Score', 'Quality', 'Active', 'Engaged', 'Light', 'Passive', 'New', 'Lapsed', 'UI user-min', 'TB', ...Object.keys(C.weights).map(k => `${k}/${C.weights[k]}`), '×conc', '×share', '×sustain', '×stall'],
    S.weekly.map(w => [w.date, w.score, esc(w.colour), w.active, w.tiers.Engaged.length, w.tiers.Light.length, w.tiers.Passive.length, w.new_, w.lapsed, w.minutes, (w.gb / 1000).toFixed(1),
      ...Object.keys(C.weights).map(k => w.detail.parts[k]), w.detail.conc, w.detail.shareF, w.detail.sustF, w.detail.stallF]), {rank: false, top: 99}),
  nrCompare: () => {
    const days = D.days.map((d, i) => ({...d, i})).filter(d => d.start + DAY > M.since);
    const p = new Map(), seen = new Set(); for (const r of S.w30) { const k = r[0] + ':' + r[1]; if (seen.has(k)) continue; seen.add(k); p.set(r[5], (p.get(r[5]) || 0) + 1); }
    const n = new Map(); for (const r of D.nr_daily) if (keepU(r[0])) n.set(r[1], (n.get(r[1]) || 0) + r[2]);
    const mx = Math.max(1, ...days.map(d => Math.max(p.get(d.i) || 0, n.get(d.i) || 0)));
    const nc = new Map(); for (const r of D.nr_caps) if (keepU(r[0])) nc.set(r[1], (nc.get(r[1]) || 0) + r[2]);
    return `<p class="small muted">Same scale. New Relic = @${esc(M.nr_domain)} users. Hide an alias with "Hide users" to remove it here and from the share.</p>
<p class="small"><b>Prospect</b>, UI user-minutes per day</p>${columns(days.map(d => [d.date, p.get(d.i) || 0]), {unit: 'user-minutes', maxv: mx, h: 120, every: 7, label: wkLabel})}
<p class="small"><b>New Relic staff</b>, UI user-minutes per day</p>${columns(days.map(d => [d.date, n.get(d.i) || 0]), {unit: 'user-minutes', maxv: mx, h: 120, every: 7, label: wkLabel, cls: 'f-nr'})}
<h3 style="margin-top:12px">New Relic staff capabilities (user-minutes)</h3>${hbars([...nc].sort((a, b) => b[1] - a[1]).slice(0, 12), 'user-minutes', 'nr')}`;
  },
  sessions: () => {
    const by = new Map(); for (const s of D.sessions) if (keepU(s.user)) { if (!by.has(s.user)) by.set(s.user, []); by.get(s.user).push(s); }
    return [...by].sort((a, b) => b[1].length - a[1].length).map(([u, ss]) => fold(`${short(u)}: ${ss.length} sessions, ${Math.round(ss.reduce((a, s) => a + s.minutes, 0))} min${ss.some(s => s.flag) ? ', ' + ss.filter(s => s.flag).length + ' flagged' : ''}`,
      table(['Start', 'End', 'Minutes', 'Active min', 'Queries', 'Distinct', 'Capabilities', 'Flag'], ss.map(s => [fmtTs(s.start), fmtTs(s.end).slice(11), s.minutes, s.active_minutes, s.queries, s.distinct, esc(s.capabilities), esc(s.flag)]), {rank: false}))).join('')
      + `<p class="small muted">Estimate: a session ends after ${M.gap}+ minutes without a query. Flags: repetitive = 30+ min with under 20% distinct queries (a tab left open); mostly idle = 60+ min with activity in under 25% of its minutes.</p>`;
  },
  apiAi: () => table(['User', 'Channel', 'Active minutes'], D.non_ui.filter(r => keepU(r[0])).sort((a, b) => b[2] - a[2]).map(r => [esc(uname(r[0])), esc(r[1]), r[2]])),
  mix: () => table(['Person', 'Cohort', 'Channel', 'Active minutes'], D.mix.filter(r => keepU(r[0])).sort((a, b) => b[3] - a[3]).map(r => [esc(uname(r[0])), esc(r[2]), esc(r[1]), r[3]])),
  changes: () => table(['Cohort', 'Origin', 'Who', 'Action', 'Count'], D.changes.filter(c => keepU(c.user)).sort((a, b) => (a.cohort !== 'Prospect') - (b.cohort !== 'Prospect') || b.n - a.n).map(c => [esc(c.cohort), esc(c.origin), esc(uname(c.user)), esc(c.action), c.n])),
  native: () => `<p class="small">${D.logins_window} logins in the last ${M.window_days} days; ${D.expiries_window} session expiries (not activity).</p>` + table(['User', 'Login', 'Hours', 'Ended'], D.native.filter(s => keepU(s.user)).map(s => [esc(uname(s.user)), fmtTs(s.start), s.hours, esc(s.end)]), {rank: false}),
  method: () => `<p class="small">Python (<code>report.py</code>, <code>pov.py</code>) fetches NrdbQuery, NrAuditEvent, NrConsumption and EntityAudits and writes <code>report.json</code> / <code>report.data.js</code>. This page holds no data; it recomputes tiers, the score, weekly series and KPIs in the browser so hidden users drop out everywhere.</p>
<p class="small">Parity with Python (no users hidden): <span id="parity-detail">${esc(parity.text)}</span></p><p class="small muted">As of ${esc(M.as_of_text)} ${esc(M.tz)} · whole PoV since ${esc(M.pov_start)} · detail window ${M.window_days} days · human = ${esc(M.human.join(', '))}.</p>`,
};

// ---------- parity check: the browser port must reproduce Python's numbers ----------
const parity = (() => {
  const save = hidden; hidden = new Set(); const s = compute(); hidden = save;
  const diffs = s.weekly.map((w, i) => [w.date, w.score, D.server.weekly[i]]).filter(x => x[1] !== x[2]);
  const ok = s.now.score === D.server.score && !diffs.length;
  return {ok, text: ok ? `matches (score ${s.now.score}, ${s.weekly.length} weekly scores)` : `MISMATCH: now ${s.now.score} vs ${D.server.score}; weeks ${diffs.map(d => d.join(' ')).join('; ')}`};
})();

function renderFilter() {
  const mins = new Map(); for (const r of D.ev) mins.set(r[0], (mins.get(r[0]) || 0) + 1); for (const r of D.nr) mins.set(r[0], (mins.get(r[0]) || 0) + r[2]);
  const group = coh => D.users.map((u, i) => ({u, i})).filter(x => D.cohort[x.i] === coh && mins.get(x.i)).sort((a, b) => mins.get(b.i) - mins.get(a.i))
    .map(x => `<label><input type="checkbox" data-u="${x.i}" ${hidden.has(x.i) ? 'checked' : ''}> ${esc(x.u)} <span class="m muted">${mins.get(x.i)} min</span></label>`).join('');
  document.getElementById('filter-pop').innerHTML = `<p class="small"><b>Hide users</b> from every chart, table and KPI. The score is <b>recomputed</b> in your browser; the action list stays as Python generated it. Saved in this browser.</p>
<p class="small muted"><b>Prospect</b></p>${group('Prospect')}<p class="small muted" style="margin-top:8px"><b>New Relic staff</b> (affects the share)</p>${group('New Relic')}
<p style="margin-top:8px"><button type="button" id="filter-clear">Show everyone</button></p>`;
  document.getElementById('filter-label').textContent = hidden.size ? `Hide users (${hidden.size} hidden)` : 'Hide users';
}
function render() {
  S = compute();
  const open = new Set([...document.querySelectorAll('details[open]')].map(d => d.querySelector('summary')?.textContent));
  const scroll = window.scrollY;
  app.innerHTML = `<header><h1>PoV engagement: <code>@${esc(M.domain)}</code></h1>
<div class="meta muted">Account ${M.account} · as of ${esc(M.as_of_text)} ${esc(M.tz)} · whole PoV since ${esc(M.pov_start)} · human = ${esc(M.human.join(', '))} · <span class="badge" data-tip="${esc(parity.text)}">${parity.ok ? '&#10003; browser = Python' : '! parity mismatch'}</span>${hidden.size ? ` · <b>${hidden.size} user${hidden.size > 1 ? 's' : ''} hidden</b>` : ''}</div></header>`
    + renderSummary() + renderPeople() + renderDid() + renderData() + renderAppendix();
  if (render.done) document.querySelectorAll('details').forEach(d => { const t = d.querySelector('summary')?.textContent; if (open.has(t)) d.open = true; else if (!d.classList.contains('filter')) d.open = false; });
  render.done = true;
  document.querySelectorAll('details[open][data-render], details[open] [data-render]').forEach(fill);
  recomputePeriod(); renderFilter(); window.scrollTo(0, scroll);
}
function fill(el) {
  const host = el.matches('details[data-render]') ? el : el;
  const key = host.dataset.render; if (!key || host.dataset.done === '1') return;
  const target = host.tagName === 'DETAILS' ? (host.querySelector(':scope > .fold-body') || host) : host;
  target.insertAdjacentHTML('beforeend', lazy[key]()); host.dataset.done = '1';
}
function recomputePeriod() {
  const s = document.getElementById('p-start'), e = document.getElementById('p-end'); if (!s) return;
  const p = period(S.weekly, s.value, e.value), out = document.getElementById('period-out');
  document.querySelectorAll('[data-week]').forEach(el => { const d = el.dataset.week; el.classList.toggle('out-of-period', !(d <= e.value && addDays(d, 6) >= s.value)); });
  out.innerHTML = p ? `<div class="kpis">
<div class="tile"><div class="tl">Period score (average of ${p.weeks} weeks)</div><div class="tv">${p.mean} <span class="small muted">/ 100</span></div><div class="ts">${esc(bandText(p.mean))}</div></div>
<div class="tile"><div class="tl">Lowest / highest week</div><div class="tv">${p.min} / ${p.max}</div><div class="ts">best week: ${band(p.max)[1]} band</div></div>
<div class="tile"><div class="tl">Trend, last 4 weeks</div><div class="tv">${p.trend}</div><div class="ts">${p.slope.toFixed(1)} points/week</div></div>
<div class="tile"><div class="tl">Quality over the period</div><div class="tv">${chip(p.colour, p.colour)}</div><div class="ts">${esc(p.reason)}</div></div></div>` : '<p class="muted small">No weeks in this period.</p>';
}

// ---------- events ----------
document.addEventListener('toggle', e => { const d = e.target; if (d.open) { if (d.dataset.render) fill(d); d.querySelectorAll('[data-render]').forEach(x => { if (!x.closest('details:not([open])')) fill(x); }); } }, true);
document.addEventListener('change', e => {
  if (e.target.matches('[data-u]')) { const i = +e.target.dataset.u; e.target.checked ? hidden.add(i) : hidden.delete(i); localStorage.setItem(KEY, JSON.stringify([...hidden])); render(); document.getElementById('filter').open = true; }
  if (e.target.id === 'p-start' || e.target.id === 'p-end') recomputePeriod();
});
document.addEventListener('click', e => {
  if (e.target.id === 'filter-clear') { hidden = new Set(); localStorage.setItem(KEY, '[]'); render(); }
  if (e.target.id === 'acts-all') { const a = document.getElementById('acts'); a.classList.toggle('all'); e.target.textContent = a.classList.contains('all') ? 'Show fewer' : 'Show all ' + a.children.length; }
  if (e.target.matches('.showall')) { const t = document.getElementById(e.target.dataset.t); t.classList.toggle('all'); e.target.textContent = t.classList.contains('all') ? 'Show top 5' : 'Show all ' + t.querySelectorAll('tbody tr').length; }
  if (e.target.matches('[data-fold]')) document.querySelectorAll('main details').forEach(d => { d.open = e.target.dataset.fold === 'open'; });
  if (e.target.id === 'theme') { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; }
  const g = e.target.closest('.pick'); if (g) { const p = document.getElementById(g.dataset.panel); if (p) p.innerHTML = `<b>${esc(g.dataset.label)}:</b> ${esc(g.dataset.names)}`; }
});
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.opacity = 0; return; } tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 10) + 'px'; });
render();
</script></body></html>
